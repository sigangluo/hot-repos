name: Trending

on:
  schedule:
    - cron: "30 1 * * *" # 每天 01:30 UTC；定时任务可能延后几分钟到几十分钟
  workflow_dispatch:

permissions:
  contents: write
  actions: write # 提交后触发 Pages 部署

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # 失败（页面结构变了、网络错误）时不产生文件，也不会提交
      - run: uv run hot-repos trending
      - run: uv run hot-repos validate
      - name: 提交快照并触发部署
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending
          if git diff --cached --quiet; then
            echo "没有变化"
            exit 0
          fi
          git commit -m "data: Trending 快照 $(date -u +%F)"
          git pull --rebase
          git push
          # 用 GITHUB_TOKEN 推送的提交不会触发其他工作流，这里显式触发页面部署
          gh workflow run pages.yml
